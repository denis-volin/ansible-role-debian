---
- name: Replace Debian package mirrors
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: 'https?://(?:deb|security)\.debian\.org/(debian(?:-security)?)'
    replace: 'https://{{ debian_mirror }}/\1'
  loop:
    - /etc/apt/sources.list
    - /etc/apt/sources.list.d/debian.sources
    - /etc/apt/mirrors/debian.list
    - /etc/apt/mirrors/debian-security.list
  notify: Update apt cache
  when: debian_mirror | length > 0
  tags: mirrors

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Install unattended-upgrades package
  ansible.builtin.apt:
    name: unattended-upgrades
    update_cache: true
    cache_valid_time: 3600
  when: debian_setup_upgrades | bool
  tags: unattended_upgrades

- name: Setup unattended upgrades
  ansible.builtin.shell: |
    set -o pipefail
    echo unattended-upgrades unattended-upgrades/enable_auto_updates boolean true | debconf-set-selections
    dpkg-reconfigure -f noninteractive unattended-upgrades
  args:
    executable: /bin/bash
    creates: /etc/apt/apt.conf.d/20auto-upgrades
  when: debian_setup_upgrades | bool
  tags: unattended_upgrades
