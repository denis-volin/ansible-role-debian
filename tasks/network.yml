---
- name: Validate shared hostname when either management feature is enabled
  ansible.builtin.assert:
    that:
      - debian_hostname is string
      - debian_hostname | trim | length > 0
    fail_msg: debian_hostname must be a nonempty string when hostname or hosts management is enabled.
  when: debian_hostname_manage | bool or debian_hosts_manage | bool
  tags:
    - hostname

- name: Validate hosts file inputs
  ansible.builtin.assert:
    that:
      - debian_hosts_address is string
      - debian_hosts_address | trim | length > 0
      - debian_hostname_short is string
    fail_msg: debian_hosts_address must be a nonempty string and debian_hostname_short must be a string (empty is allowed).
  when: debian_hosts_manage | bool
  tags:
    - hostname

- name: Set hostname with systemd
  ansible.builtin.hostname:
    use: systemd
    name: "{{ debian_hostname }}"
  when: debian_hostname_manage | bool
  tags:
    - hostname

- name: Manage /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"
  when: debian_hosts_manage | bool
  tags:
    - hostname

- name: Set up /etc/resolv.conf file
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    follow: false
    owner: root
    group: root
    mode: "0644"
  when: debian_dns_servers | length > 0
  tags:
    - dns

- name: Stop and disable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved.service
    state: stopped
    enabled: false
  when:
    - "'systemd-resolved' in ansible_facts.packages"
    - debian_dns_servers | length > 0
  tags:
    - dns

- name: Configure OpenSSH server
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/99-ansible.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd
  when: debian_ssh_disable_password_auth | bool or debian_ssh_listen_addresses | length > 0
  tags:
    - ssh
