---
- name: Set hostname with systemd
  ansible.builtin.hostname:
    use: systemd
    name: "{{ debian_hostname }}"
  when:
    - debian_set_systemd_hostname | bool
    - debian_hostname | length > 0
  tags:
    - hostname

- name: Manage /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"
  when:
    - debian_host | length > 0
    - debian_hostname | length > 0
    - debian_hostname_short | length > 0
  tags:
    - hostname

- name: Stop and disable systemd-resolvd
  ansible.builtin.systemd:
    name: systemd-resolved.service
    state: stopped
    enabled: false
  when:
    - "'systemd-resolved' in ansible_facts.packages"
    - debian_dns_servers | length > 0
  tags:
    - dns

- name: Set up /etc/resolv.conf file
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
  when: debian_dns_servers | length > 0
  tags:
    - dns

- name: Set up network interfaces file
  ansible.builtin.template:
    src: "{{ debian_interfaces_template }}"
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: "0644"
  notify: Apply interfaces
  when: debian_interfaces_template | length > 0
  tags:
    - interfaces

- name: Configure OpenSSH server
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/99-ansible.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd
  when: debian_ssh_disable_password_auth | bool or debian_ssh_listen_addresses | length > 0
  tags:
    - ssh
