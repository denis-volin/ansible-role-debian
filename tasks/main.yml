---
# tasks file for debian
- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: apt
  tags: [network, dns, misc, cloudinit]

- name: Include APT tasks
  ansible.builtin.include_tasks:
    file: apt/main.yml
    apply:
      tags: apt
  tags: [apt, sources, autoupgrades, packages]

- name: Include network tasks
  ansible.builtin.include_tasks:
    file: network/main.yml
    apply:
      tags: network
  tags: [network, hostname, dns, ssh]

- name: Include miscellaneous tasks
  ansible.builtin.include_tasks:
    file: misc/main.yml
    apply:
      tags: misc
  tags: [misc, cloudinit, locale, timezone, logs]
