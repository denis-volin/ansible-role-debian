---
# tasks file for debian
- name: Include APT tasks
  ansible.builtin.include_tasks:
    file: apt/main.yml
    apply:
      tags: apt
  tags: [apt, sources, autoupgrades, packages]

- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: apt
  tags:
    - always

- name: Disable cloud-init on boot
  when:
    - "'cloud-init' in ansible_facts.packages"
    - debian_disable_cloudinit | bool
  ansible.builtin.copy:
    content: ""
    dest: /etc/cloud/cloud-init.disabled
    owner: root
    group: root
    mode: "0644"
  tags:
    - cloudinit

- name: Configure networking
  ansible.builtin.include_tasks:
    file: network.yml
    apply:
      tags:
        - network
  tags:
    - network
    - hostname
    - dns
    - ssh

- name: Configure locales
  when: debian_locales | length > 0
  ansible.builtin.include_tasks:
    file: locale.yml
    apply:
      tags:
        - locale
  tags:
    - locale

- name: Configure NTP and timezone
  ansible.builtin.include_tasks:
    file: time.yml
    apply:
      tags:
        - time
  tags:
    - time
    - ntp
    - timezone

- name: Configure journald persistent logs
  when: debian_setup_journald | bool
  ansible.builtin.include_tasks:
    file: logs.yml
    apply:
      tags:
        - logs
  tags:
    - logs
