---
# defaults file for debian

debian_apt_manage_sources: false
debian_apt_mirror: https://deb.debian.org/debian
debian_apt_security_mirror: https://security.debian.org/debian-security
debian_apt_autoupgrades: true
debian_apt_packages: []

debian_disable_cloudinit: false

# Controls setting the system hostname only; /etc/hosts management is independent.
debian_hostname_manage: true

# Hostname shared by system hostname and /etc/hosts management.
debian_hostname: "{{ inventory_hostname }}"

# Short alias derived from debian_hostname. Explicit overrides win.
# An empty alias writes only debian_hostname in /etc/hosts.
debian_hostname_short: "{{ debian_hostname.split('.', 1)[0] }}"

# Controls management of the entire /etc/hosts file.
debian_hosts_manage: true

# IP address for the primary /etc/hosts entry.
# Proxmox VE nodes must override this with a reachable, non-loopback node IP.
debian_hosts_address: 127.0.1.1

# Additional raw /etc/hosts entries. Each list item is rendered as its own line.
debian_hosts_extra: []

# DNS resolver addresses to write to /etc/resolv.conf.
# When this list is not empty, systemd-resolved is stopped and disabled if it is installed.
# Set to [] to skip resolv management.
debian_dns_servers:
  - 1.1.1.1
  - 1.0.0.1

# DNS search domain written to /etc/resolv.conf. Set to "" to omit the search line.
# The default uses everything after the first dot, ignoring a trailing DNS root dot.
# Empty and single-label hostnames produce no search domain. Explicit overrides win.
debian_search_domain: "{{ debian_hostname.rstrip('.').split('.', 1)[1] | default('') }}"

debian_interfaces_template: ""

debian_apply_interfaces: false

debian_ssh_disable_password_auth: true

debian_ssh_listen_addresses: []

# Locales to generate on the host.
# Set to [] to skip locales management.
debian_locales:
  - en_US.UTF-8

# NTP servers configured for systemd-timesyncd.
# Set to [] to skip installing and configuring systemd-timesyncd.
debian_ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
  - 3.pool.ntp.org

# Timezone in `tz database` format to set.
# Examples: "Etc/UTC", "Europe/Warsaw".
# Set to "" to skip timezone management.
debian_timezone: ""

# Set to false to skip setup of persistent journald logs.
debian_setup_journald: true
