---
# handlers file for debian
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Validate SSH configuration
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false

- name: Reload SSH
  ansible.builtin.systemd:
    name: ssh.service
    state: reloaded

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald.service
    state: restarted

- name: Flush journald
  ansible.builtin.command:
    cmd: journalctl --flush
  changed_when: true
