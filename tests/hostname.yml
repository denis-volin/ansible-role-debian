---
# Run: ansible-playbook -i localhost, -c local tests/hostname.yml
- name: Verify hostname controls without changing system configuration
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../defaults/main.yml
  vars:
    ansible_managed: Ansible managed
    hosts_template_path: "{{ playbook_dir }}/../templates/hosts.j2"
    network_tasks: "{{ lookup('ansible.builtin.file', '../tasks/network.yml') | from_yaml }}"
    hostname_cases:
      - name: Both features enabled
        hostname: app.example.com
        expected_short: app
        expected_line: 127.0.1.1 app.example.com app
      - name: Nested domain
        hostname: app.dc.example.com
        expected_short: app
        expected_line: 127.0.1.1 app.dc.example.com app
      - name: Single-label hostname
        hostname: app
        expected_short: app
        expected_line: 127.0.1.1 app
      - name: Only hostname management enabled
        hostname: app.example.com
        hosts_manage: false
        expected_short: app
      - name: Only hosts management enabled for Proxmox
        hostname: pve1.example.com
        hostname_manage: false
        address: 192.0.2.20
        expected_short: pve1
        expected_line: 192.0.2.20 pve1.example.com pve1
      - name: Both features disabled with empty values
        hostname: ""
        address: ""
        hostname_manage: false
        hosts_manage: false
        expected_short: ""
      - name: Empty hostname with both features enabled fails
        hostname: ""
        expected_failure: true
        expected_error: debian_hostname
      - name: Empty hostname with only hosts enabled fails
        hostname: ""
        hostname_manage: false
        expected_failure: true
        expected_error: debian_hostname
      - name: Empty hostname with only hostname enabled fails
        hostname: ""
        hosts_manage: false
        expected_failure: true
        expected_error: debian_hostname
      - name: Empty hosts address fails
        hostname: app.example.com
        address: ""
        expected_failure: true
        expected_error: debian_hosts_address
      - name: Unused empty hosts address does not block hostname management
        hostname: app.example.com
        address: ""
        hosts_manage: false
        expected_short: app
    alias_cases:
      - name: Explicit short alias
        hostname: app.example.com
        short: custom
        expected_short: custom
        expected_line: 127.0.1.1 app.example.com custom
      - name: Empty alias omits alias but still manages hosts
        hostname: app.example.com
        short: ""
        expected_short: ""
        expected_line: 127.0.1.1 app.example.com
      - name: Duplicate alias removed
        hostname: app.example.com
        short: app.example.com
        expected_short: app.example.com
        expected_line: 127.0.1.1 app.example.com
      - name: Case-insensitive duplicate alias removed
        hostname: app
        short: App
        expected_short: App
        expected_line: 127.0.1.1 app
    # Keep the actual validation tasks and guards. Replace only the two mutating
    # actions with debug probes, so no test can set the hostname or write /etc/hosts.
    probe_tasks:
      - "{{ network_tasks[0] }}"
      - "{{ network_tasks[1] }}"
      - name: Probe system hostname action
        ansible.builtin.debug:
          msg: Hostname setter invoked
        when: "{{ network_tasks[2]['when'] }}"
        register: hostname_probe
      - name: Probe hosts file action and render its real template
        ansible.builtin.debug:
          msg: "{{ '{{ lookup(\"ansible.builtin.template\", hosts_template_path) }}' }}"
        when: "{{ network_tasks[3]['when'] }}"
        register: hosts_probe
  tasks:
    - name: Verify defaults and expected production action layout
      ansible.builtin.assert:
        that:
          - debian_hostname == inventory_hostname
          - debian_hostname_manage | bool
          - debian_hosts_manage | bool
          - debian_hosts_address == '127.0.1.1'
          - "'ansible.builtin.assert' in network_tasks[0]"
          - "'ansible.builtin.assert' in network_tasks[1]"
          - network_tasks[2]['ansible.builtin.hostname']['use'] == 'systemd'
          - network_tasks[3]['ansible.builtin.template']['src'] == 'hosts.j2'
          - network_tasks[3]['ansible.builtin.template']['dest'] == '/etc/hosts'

    - name: Create isolated probe task file on the controller
      ansible.builtin.tempfile:
        state: file
        suffix: .yml
        path: "{{ lookup('ansible.builtin.env', 'TMPDIR') }}"
      register: probe_file

    - name: Exercise production validations and guards with safe action probes
      vars:
        debian_hosts_extra:
          - 192.0.2.99 extra.example.com extra
      block:
        - name: Write probe tasks
          ansible.builtin.copy:
            content: "{{ probe_tasks | to_nice_yaml }}"
            dest: "{{ probe_file.path }}"
            mode: "0600"

        - name: Check derived aliases and independent controls
          ansible.builtin.include_tasks: hostname-case.yml
          loop: "{{ hostname_cases }}"
          loop_control:
            loop_var: hostname_case
            label: "{{ hostname_case.name }}"
          vars:
            debian_hostname: "{{ hostname_case.hostname }}"
            debian_hosts_address: "{{ hostname_case.address | default('127.0.1.1') }}"
            debian_hostname_manage: "{{ hostname_case.hostname_manage | default(true) }}"
            debian_hosts_manage: "{{ hostname_case.hosts_manage | default(true) }}"

        - name: Check explicit alias overrides
          ansible.builtin.include_tasks: hostname-case.yml
          loop: "{{ alias_cases }}"
          loop_control:
            loop_var: hostname_case
            label: "{{ hostname_case.name }}"
          vars:
            debian_hostname: "{{ hostname_case.hostname }}"
            debian_hostname_short: "{{ hostname_case.short }}"
      always:
        - name: Remove isolated probe task file
          ansible.builtin.file:
            path: "{{ probe_file.path }}"
            state: absent
