---
- name: Reset case observations
  ansible.builtin.set_fact:
    probe_failed: false
    probe_error: ""
    hostname_probe: {}
    hosts_probe: {}

- name: Run actual validation tasks and action guards
  block:
    - name: Execute safe production probes
      ansible.builtin.include_tasks: "{{ probe_file.path }}"
  rescue:
    - name: Capture expected validation failure
      ansible.builtin.set_fact:
        probe_failed: true
        probe_error: "{{ ansible_failed_result.msg }}"

- name: Verify validation outcome
  ansible.builtin.assert:
    that:
      - probe_failed == (hostname_case.expected_failure | default(false))
      - not probe_failed or hostname_case.expected_error in probe_error
      - not probe_failed or (hostname_probe == {} and hosts_probe == {})

- name: Verify independently controlled actions and derived alias
  ansible.builtin.assert:
    that:
      - debian_hostname_short == hostname_case.expected_short
      - (hostname_probe is not skipped) == (debian_hostname_manage | bool)
      - (hosts_probe is not skipped) == (debian_hosts_manage | bool)
  when: not probe_failed

- name: Verify rendered hosts entry and existing template features
  ansible.builtin.assert:
    that:
      - hostname_case.expected_line in hosts_probe.msg.splitlines()
      - "'127.0.0.1 localhost.localdomain localhost' in hosts_probe.msg.splitlines()"
      - "'::1     ip6-localhost ip6-loopback' in hosts_probe.msg.splitlines()"
      - "'192.0.2.99 extra.example.com extra' in hosts_probe.msg.splitlines()"
  when:
    - not probe_failed
    - debian_hosts_manage | bool
